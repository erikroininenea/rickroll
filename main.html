<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Bakgrund</title>
    <style>
        /* Se till att videon täcker hela sidan */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* täcker hela sidan utan att förvrängas */
            z-index: -1; /* bakom allt innehåll */
        }
    </style>
</head>
<body>
    <video autoplay loop playsinline>
        <source src="video.webm" type="video/webm">
        Din webbläsare stödjer inte videon.
    </video>
</body>
</html>
