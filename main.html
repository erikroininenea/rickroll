<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Bakgrund</title>
    <style>
        /* Se till att videon täcker hela sidan */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: -1; /* så att videon är bakom annat innehåll om du vill lägga något ovanpå */
        }
    </style>
</head>
<body>
    <video autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/erikroininenea/rickroll/refs/heads/main/video.webm" type="video/webm">
        Din webbläsare stödjer inte videon.
    </video>
</body>
</html>
